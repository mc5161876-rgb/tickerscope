[project]
name = "tickerscope"
version = "0.1.0"
description = "TickerScope - a one-page company report with plain-English metric explainers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "yfinance==0.2.66",
    "rapidfuzz>=3.9,<4",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
"scripts/smoke_cdp.py" = ["E501"]  # embedded JS one-liners
